name: CI

# Layout: services are flat directories named by plane prefix (m- management, c- control, e- edge,
# a- analytics). The m-* and c-* services share ONE Go module (the repo root, go.mod) that
# `replace`s github.com/metap-org/metap => ../metap, so those jobs need a sibling checkout of
# metap-org/metap. e-edge and a-api are their own modules and may import only metap's
# standard-library-only pkg/kit/* (depguard-enforced by each one's .golangci.yml).

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  waap-go:
    name: m-* and c-* services — build, vet, unit tests, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: waap
      # Build against the metap branch with the same name when one exists (a change spanning
      # both repos is then testable before metap's side merges), else metap's master. The
      # branch name comes in through env, never ${{ }} interpolation, so it can't inject shell.
      - id: metap-ref
        shell: bash
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/metap-org/metap.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "metap ref: $(tail -1 "$GITHUB_OUTPUT")"
      - uses: actions/checkout@v4
        with:
          repository: metap-org/metap
          ref: ${{ steps.metap-ref.outputs.ref }}
          path: metap
      - uses: actions/setup-go@v5
        with:
          go-version-file: waap/go.mod
          cache-dependency-path: waap/go.sum
      - working-directory: waap
        run: go build ./...
      - working-directory: waap
        run: go vet ./...
      # Unit tests only — integration tests carry `//go:build integration` (metap's pkg/testkit
      # convention) and need real Postgres: `go test -tags integration ./...` locally.
      - working-directory: waap
        run: go test ./...
      - working-directory: waap
        run: go vet -tags integration ./...
      # depguard (waap/.golangci.yml): rules/ is standard-library only, entities/ only declare.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: waap
      - working-directory: waap
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

  waap-go-security:
    name: m-* and c-* services — dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: waap
      # Build against the metap branch with the same name when one exists (a change spanning
      # both repos is then testable before metap's side merges), else metap's master. The
      # branch name comes in through env, never ${{ }} interpolation, so it can't inject shell.
      - id: metap-ref
        shell: bash
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/metap-org/metap.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "metap ref: $(tail -1 "$GITHUB_OUTPUT")"
      - uses: actions/checkout@v4
        with:
          repository: metap-org/metap
          ref: ${{ steps.metap-ref.outputs.ref }}
          path: metap
      - uses: actions/setup-go@v5
        with:
          go-version-file: waap/go.mod
          cache-dependency-path: waap/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - working-directory: waap
        run: govulncheck ./...

  a-api-go:
    name: a-api (analytics plane) — build, vet, unit tests, fmt, metap-kit-only guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waap/a-api
    steps:
      - uses: actions/checkout@v4
        with:
          path: waap
      # Build against the metap branch with the same name when one exists (a change spanning
      # both repos is then testable before metap's side merges), else metap's master. The
      # branch name comes in through env, never ${{ }} interpolation, so it can't inject shell.
      - id: metap-ref
        shell: bash
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/metap-org/metap.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "metap ref: $(tail -1 "$GITHUB_OUTPUT")"
      - uses: actions/checkout@v4
        with:
          repository: metap-org/metap
          ref: ${{ steps.metap-ref.outputs.ref }}
          path: metap
      - uses: actions/setup-go@v5
        with:
          go-version-file: waap/a-api/go.mod
          cache-dependency-path: waap/a-api/go.sum
      - run: go build ./...
      - run: go vet ./...
      # Unit tests only; store/clickhouse_integration_test.go (-tags integration) needs a real
      # ClickHouse and is run locally, like the other planes' integration suites.
      - run: go test ./...
      - run: go vet -tags integration ./...
      # depguard (.golangci.yml): from metap, only pkg/kit/* may be imported.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: waap/a-api
      - run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

  e-edge-go:
    name: e-edge (edge plane) — build, vet, unit tests, fmt, metap-kit-only guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waap/e-edge
    steps:
      - uses: actions/checkout@v4
        with:
          path: waap
      # Build against the metap branch with the same name when one exists (a change spanning
      # both repos is then testable before metap's side merges), else metap's master. The
      # branch name comes in through env, never ${{ }} interpolation, so it can't inject shell.
      - id: metap-ref
        shell: bash
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/metap-org/metap.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "metap ref: $(tail -1 "$GITHUB_OUTPUT")"
      - uses: actions/checkout@v4
        with:
          repository: metap-org/metap
          ref: ${{ steps.metap-ref.outputs.ref }}
          path: metap
      - uses: actions/setup-go@v5
        with:
          go-version-file: waap/e-edge/go.mod
          cache-dependency-path: waap/e-edge/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # depguard (.golangci.yml): from metap, only pkg/kit/* may be imported.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: waap/e-edge
      - run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

  e-edge-go-security:
    name: e-edge (edge plane) — dependency vulnerability audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waap/e-edge
    steps:
      - uses: actions/checkout@v4
        with:
          path: waap
      # Build against the metap branch with the same name when one exists (a change spanning
      # both repos is then testable before metap's side merges), else metap's master. The
      # branch name comes in through env, never ${{ }} interpolation, so it can't inject shell.
      - id: metap-ref
        shell: bash
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/metap-org/metap.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "metap ref: $(tail -1 "$GITHUB_OUTPUT")"
      - uses: actions/checkout@v4
        with:
          repository: metap-org/metap
          ref: ${{ steps.metap-ref.outputs.ref }}
          path: metap
      - uses: actions/setup-go@v5
        with:
          go-version-file: waap/e-edge/go.mod
          cache-dependency-path: waap/e-edge/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # m-web is deliberately not covered here yet: its 3 workspace dependencies
  # (@metap/platform-ui, @metap/theme-enterprise, @metap/ui) are `link:` deps into 3 separate
  # sibling repos (../../../platform-ui, ../../../metap-themes/packages/enterprise,
  # ../../../design-system), and @metap/ui specifically is consumed through its own built
  # `dist/` (its package.json `exports` map points there, not at source) — so a CI job for this
  # package needs to check out and build 3 other repos first, a bigger cross-repo CI wiring
  # problem than this pass's scope. Flagged as a known follow-up rather than shipped unverified.

  semgrep:
    name: Semgrep — logic/secrets scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep
      - run: semgrep scan --config p/golang --config p/secrets --config .semgrep.yml --error

  labs-infra:
    name: labs — luật firewall từ ma trận, Ansible lint, render template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài công cụ
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nftables
          python3 -m pip install -q pyyaml ansible ansible-lint markdown-it-py
      - name: Sinh luật và kiểm T07 hai chiều (7.6 <-> luật, cấm tuyệt đối)
        run: |
          python3 labs/infra/tools/test_gen_nft.py
          python3 labs/infra/tools/steps.py validate
          python3 labs/infra/tools/test_steps.py
          python3 labs/infra/tools/gen_nft.py check compact
          python3 labs/infra/tools/gen_nft.py check full
          python3 labs/infra/tools/gen_nft.py gen compact --bootstrap -o labs/infra/generated/compact
          python3 labs/infra/tools/gen_nft.py gen compact -o labs/infra/generated/compact
          for f in labs/infra/generated/compact/ruleset.nft labs/infra/generated/compact/hosts/*.nft; do sudo nft -c -f "$f"; done
          python3 labs/infra/tools/gen_nft.py gen full --bootstrap -o labs/infra/generated/full
          for f in labs/infra/generated/full/ruleset.nft labs/infra/generated/full/hosts/*.nft; do sudo nft -c -f "$f"; done
      - name: Ansible lint, syntax và render template
        working-directory: labs/ansible
        run: |
          python3 ../infra/tools/gen_lab.py inventory compact -o ../infra/generated/compact/inventory
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPLACEHOLDERFORSYNTAXCHECKONLY000000000 ci" > ../infra/generated/ssh_user_ca.pub
          python3 ../infra/tools/gen_apps.py && git diff --exit-code -- apps || { echo "apps/*.yml lệch gen_apps.py, chạy lại rồi commit"; exit 1; }
          ansible-lint
          for f in apps/*.yml; do ansible-playbook "$f" --syntax-check -i localhost,; done
          ansible-playbook site.yml --syntax-check
          ansible-playbook services.yml --syntax-check -e "{lab_secrets: {}}"
          ansible-playbook push.yml --syntax-check
          ANSIBLE_ROLES_PATH=roles ansible-playbook -c local -i localhost, -e @tests/vars.yml tests/render.yml
