          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

  edge-plane-go-security:
    name: edge-plane — dependency vulnerability audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waap/edge-plane
    steps:
      - uses: actions/checkout@v4
        with:
          path: waap
      # Build against the metap branch with the same name when one exists (a change spanning
      # both repos is then testable before metap's side merges), else metap's master. The
      # branch name comes in through env, never ${{ }} interpolation, so it can't inject shell.
      - id: metap-ref
        shell: bash
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/metap-org/metap.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "metap ref: $(tail -1 "$GITHUB_OUTPUT")"
      - uses: actions/checkout@v4
        with:
          repository: metap-org/metap
          ref: ${{ steps.metap-ref.outputs.ref }}
          path: metap
      - uses: actions/setup-go@v5
        with:
          go-version-file: waap/edge-plane/go.mod
          cache-dependency-path: waap/edge-plane/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # management-plane/web is deliberately not covered here yet: its 3 workspace dependencies
  # (@metap/platform-ui, @metap/theme-enterprise, @metap/ui) are `link:` deps into 3 separate
  # sibling repos (../../../platform-ui, ../../../metap-themes/packages/enterprise,
  # ../../../design-system), and @metap/ui specifically is consumed through its own built
  # `dist/` (its package.json `exports` map points there, not at source) — so a CI job for this
  # package needs to check out and build 3 other repos first, a bigger cross-repo CI wiring
  # problem than this pass's scope. Flagged as a known follow-up rather than shipped unverified.

  semgrep:
    name: Semgrep — logic/secrets scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep
      - run: semgrep scan --config p/golang --config p/secrets --config .semgrep.yml --error
