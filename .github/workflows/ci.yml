name: CI

# metap-demo-waf has no CI of its own yet — this is the first workflow added, mirroring
# ../metap's own ci.yml job shape (build/vet/test/fmt, a separate govulncheck job per Go
# module, a separate Semgrep job) now that all 3 planes are Go-only (see root CLAUDE.md's
# "Rust removed from all 3 planes" note). management-plane and control-plane each
# `replace github.com/metap-org/metap => ../../../metap` — both jobs need a sibling
# checkout of metap-org/metap at that same relative path. edge-plane does too since
# 2026-11-07, but may import only metap's standard-library-only pkg/kit/* (depguard-enforced,
# edge-plane/.golangci.yml) — never the metadata/CRUD platform.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  management-plane-go:
    name: management-plane — build, vet, unit tests, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: waap
      # Build against the metap branch with the same name when one exists (a change spanning
      # both repos is then testable before metap's side merges), else metap's master. The
      # branch name comes in through env, never ${{ }} interpolation, so it can't inject shell.
      - id: metap-ref
        shell: bash
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/metap-org/metap.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "metap ref: $(tail -1 "$GITHUB_OUTPUT")"
      - uses: actions/checkout@v4
        with:
          repository: metap-org/metap
          ref: ${{ steps.metap-ref.outputs.ref }}
          path: metap
      - uses: actions/setup-go@v5
        with:
          go-version-file: waap/management-plane/go.mod
          cache-dependency-path: waap/management-plane/go.sum
      - working-directory: waap/management-plane
        run: go build ./...
      - working-directory: waap/management-plane
        run: go vet ./...
      # Unit tests only — integration tests carry `//go:build integration` (metap's pkg/testkit
      # convention) and need real Postgres: `go test -tags integration ./...` locally.
      - working-directory: waap/management-plane
        run: go test ./...
      - working-directory: waap/management-plane
        run: go vet -tags integration ./...
      - working-directory: waap/management-plane
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

  management-plane-go-security:
    name: management-plane — dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: waap
      # Build against the metap branch with the same name when one exists (a change spanning
      # both repos is then testable before metap's side merges), else metap's master. The
      # branch name comes in through env, never ${{ }} interpolation, so it can't inject shell.
      - id: metap-ref
        shell: bash
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/metap-org/metap.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "metap ref: $(tail -1 "$GITHUB_OUTPUT")"
      - uses: actions/checkout@v4
        with:
          repository: metap-org/metap
          ref: ${{ steps.metap-ref.outputs.ref }}
          path: metap
      - uses: actions/setup-go@v5
        with:
          go-version-file: waap/management-plane/go.mod
          cache-dependency-path: waap/management-plane/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - working-directory: waap/management-plane
        run: govulncheck ./...

  control-plane-go:
    name: control-plane — build, vet, unit tests, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: waap
      # Build against the metap branch with the same name when one exists (a change spanning
      # both repos is then testable before metap's side merges), else metap's master. The
      # branch name comes in through env, never ${{ }} interpolation, so it can't inject shell.
      - id: metap-ref
        shell: bash
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/metap-org/metap.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "metap ref: $(tail -1 "$GITHUB_OUTPUT")"
      - uses: actions/checkout@v4
        with:
          repository: metap-org/metap
          ref: ${{ steps.metap-ref.outputs.ref }}
          path: metap
      - uses: actions/setup-go@v5
        with:
          go-version-file: waap/control-plane/go.mod
          cache-dependency-path: waap/control-plane/go.sum
      - working-directory: waap/control-plane
        run: go build ./...
      - working-directory: waap/control-plane
        run: go vet ./...
      - working-directory: waap/control-plane
        run: go test ./...
      - working-directory: waap/control-plane
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

  control-plane-go-security:
    name: control-plane — dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: waap
      # Build against the metap branch with the same name when one exists (a change spanning
      # both repos is then testable before metap's side merges), else metap's master. The
      # branch name comes in through env, never ${{ }} interpolation, so it can't inject shell.
      - id: metap-ref
        shell: bash
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/metap-org/metap.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "metap ref: $(tail -1 "$GITHUB_OUTPUT")"
      - uses: actions/checkout@v4
        with:
          repository: metap-org/metap
          ref: ${{ steps.metap-ref.outputs.ref }}
          path: metap
      - uses: actions/setup-go@v5
        with:
          go-version-file: waap/control-plane/go.mod
          cache-dependency-path: waap/control-plane/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - working-directory: waap/control-plane
        run: govulncheck ./...

  # Dev/staging DNS stand-in — its own module with no metap dependency, so no metap checkout.
  dns-mock-go:
    name: devtools/dns-mock — build, vet, unit tests, fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devtools/dns-mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: devtools/dns-mock/go.mod
          cache-dependency-path: devtools/dns-mock/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

  analytics-plane-go:
    name: analytics-plane — build, vet, unit tests, fmt, metap-kit-only guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waap/analytics-plane
    steps:
      - uses: actions/checkout@v4
        with:
          path: waap
      # Build against the metap branch with the same name when one exists (a change spanning
      # both repos is then testable before metap's side merges), else metap's master. The
      # branch name comes in through env, never ${{ }} interpolation, so it can't inject shell.
      - id: metap-ref
        shell: bash
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/metap-org/metap.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "metap ref: $(tail -1 "$GITHUB_OUTPUT")"
      - uses: actions/checkout@v4
        with:
          repository: metap-org/metap
          ref: ${{ steps.metap-ref.outputs.ref }}
          path: metap
      - uses: actions/setup-go@v5
        with:
          go-version-file: waap/analytics-plane/go.mod
          cache-dependency-path: waap/analytics-plane/go.sum
      - run: go build ./...
      - run: go vet ./...
      # Unit tests only; store/clickhouse_integration_test.go (-tags integration) needs a real
      # ClickHouse and is run locally, like the other planes' integration suites.
      - run: go test ./...
      - run: go vet -tags integration ./...
      # depguard (.golangci.yml): from metap, only pkg/kit/* may be imported.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: waap/analytics-plane
      - run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

  edge-plane-go:
    name: edge-plane — build, vet, unit tests, fmt, metap-kit-only guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waap/edge-plane
    steps:
      - uses: actions/checkout@v4
        with:
          path: waap
      # Build against the metap branch with the same name when one exists (a change spanning
      # both repos is then testable before metap's side merges), else metap's master. The
      # branch name comes in through env, never ${{ }} interpolation, so it can't inject shell.
      - id: metap-ref
        shell: bash
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/metap-org/metap.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
          echo "metap ref: $(tail -1 "$GITHUB_OUTPUT")"
      - uses: actions/checkout@v4
        with:
          repository: metap-org/metap
          ref: ${{ steps.metap-ref.outputs.ref }}
          path: metap
      - uses: actions/setup-go@v5
        with:
          go-version-file: waap/edge-plane/go.mod
          cache-dependency-path: waap/edge-plane/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # depguard (.golangci.yml): from metap, only pkg/kit/* may be imported.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: waap/edge-plane
