# The WAF Customer Portal backend + web (production-mode images). Uses the shared dev
# Postgres/RabbitMQ that ../../metap/docker-compose.yml runs (`docker compose up -d postgres
# rabbitmq` there, host ports 5433/5672), reached through host.docker.internal.
#
# Before the first `docker compose up --build` (from this directory):
#   1. keys:   (cd ../../metap && go run ./cmd/dev-tools gen-keys ../waap/data-plane/keys)
#   2. tenant + users + .env: see README.md "Chạy local" — the gateway logs into every upstream
#      with WAF_SERVICE_EMAIL/WAF_SERVICE_PASSWORD from .env (see .env.example).
#
# Every build uses `context: ../../` (the metap-org root): ./Dockerfile needs ../../metap for
# go.mod's replace, web/Dockerfile needs design-system/platform-ui/metap-themes.
x-service: &service
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./keys:/app/keys:ro

x-service-env: &service-env
  DATABASE_URL: postgres://metap:metap@host.docker.internal:5433/metap
  RABBITMQ_URL: amqp://metap:metap@host.docker.internal:5672
  CORS_ORIGINS: http://localhost:5173,http://localhost:8081
  AUTH_JWT_PUBLIC_KEY_PATH: /app/keys/dev-jwt-public.pem
  AUTH_JWT_PRIVATE_KEY_PATH: /app/keys/dev-jwt-private.pem
  GRPC_ENABLED: "true"

services:
  zones-service:
    <<: *service
    build: { context: ../../, dockerfile: waap/data-plane/Dockerfile, args: { SERVICE: zones-service } }
    ports: ["3000:3000", "3001:3001"]
    environment:
      <<: *service-env
      PORT: "3000"
      # gRPC targets for the cross-service zone-delete check (GuardedZonesBackend).
      SCANNING_GRPC_ADDR: scanning-service:3011
      ALERTING_GRPC_ADDR: alerting-service:3021
    healthcheck: &health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  scanning-service:
    <<: *service
    build: { context: ../../, dockerfile: waap/data-plane/Dockerfile, args: { SERVICE: scanning-service } }
    ports: ["3010:3010", "3011:3011"]
    environment:
      <<: *service-env
      PORT: "3010"
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/health"]

  alerting-service:
    <<: *service
    build: { context: ../../, dockerfile: waap/data-plane/Dockerfile, args: { SERVICE: alerting-service } }
    ports: ["3020:3020", "3021:3021"]
    environment:
      <<: *service-env
      PORT: "3020"
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3020/health"]

  graphql-gateway:
    <<: *service
    build: { context: ../../, dockerfile: waap/data-plane/Dockerfile, args: { SERVICE: waf-graphql-gateway } }
    ports: ["4000:4000"]
    environment:
      PORT: "4000"
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
      AUTH_JWT_PUBLIC_KEY_PATH: /app/keys/dev-jwt-public.pem
      UPSTREAM_1_NAME: zones
      UPSTREAM_1_GRPC_ADDR: zones-service:3001
      UPSTREAM_1_LOGIN_URL: http://zones-service:3000/auth/login
      UPSTREAM_1_SERVICE_EMAIL: ${WAF_SERVICE_EMAIL:?set WAF_SERVICE_EMAIL in .env}
      UPSTREAM_1_SERVICE_PASSWORD: ${WAF_SERVICE_PASSWORD:?set WAF_SERVICE_PASSWORD in .env}
      UPSTREAM_2_NAME: scanning
      UPSTREAM_2_GRPC_ADDR: scanning-service:3011
      UPSTREAM_2_LOGIN_URL: http://scanning-service:3010/auth/login
      UPSTREAM_2_SERVICE_EMAIL: ${WAF_SERVICE_EMAIL}
      UPSTREAM_2_SERVICE_PASSWORD: ${WAF_SERVICE_PASSWORD}
      UPSTREAM_3_NAME: alerting
      UPSTREAM_3_GRPC_ADDR: alerting-service:3021
      UPSTREAM_3_LOGIN_URL: http://alerting-service:3020/auth/login
      UPSTREAM_3_SERVICE_EMAIL: ${WAF_SERVICE_EMAIL}
      UPSTREAM_3_SERVICE_PASSWORD: ${WAF_SERVICE_PASSWORD}
    depends_on:
      zones-service: { condition: service_healthy }
      scanning-service: { condition: service_healthy }
      alerting-service: { condition: service_healthy }

  # Production-mode web (pnpm build + nginx). For the Vite dev server use docker-compose.dev.yml.
  web:
    build: { context: ../../, dockerfile: waap/data-plane/web/Dockerfile }
    ports: ["8081:80"]
    depends_on:
      zones-service: { condition: service_healthy }
      scanning-service: { condition: service_healthy }
      alerting-service: { condition: service_healthy }
      graphql-gateway: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
