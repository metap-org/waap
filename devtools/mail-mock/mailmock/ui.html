<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail mock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='5' width='18' height='14' rx='3'/%3E%3Cpath d='m3 8 9 6 9-6'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#f4f5f9; --surface:#fff; --surface-2:#f8f9fc; --fg:#16181d; --muted:#6b7280; --line:#e6e8ef;
    --accent:#5b5bd6; --accent-soft:#eceefd; --accent-fg:#fff; --good:#12805c; --good-soft:#e3f5ee; --warn:#b54708; --bad:#c4321c;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06); --radius:12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d0e12; --surface:#15171d; --surface-2:#1a1d25; --fg:#e8eaf0; --muted:#8b93a3; --line:#262a35;
      --accent:#8b8bf5; --accent-soft:#232547; --accent-fg:#0d0e12; --good:#4ade80; --good-soft:#102a1c; --warn:#fbbf24; --bad:#f87171;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  button, input { font:inherit; color:inherit; }
  .app { display:flex; flex-direction:column; height:100vh; }

  header { display:flex; align-items:center; gap:14px; padding:12px 20px; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:650; font-size:15px; letter-spacing:-.01em; }
  .logo { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; box-shadow:0 2px 8px rgba(99,102,241,.4); }
  .logo svg { width:17px; height:17px; }
  .brand small { color:var(--muted); font-weight:500; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); color:var(--muted); font-size:12px; cursor:pointer; transition:border-color .15s, color .15s; }
  .chip:hover { border-color:var(--accent); color:var(--fg); }
  .chip b { color:var(--fg); font-weight:600; letter-spacing:.02em; }
  .chip code { font:12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--good); box-shadow:0 0 0 3px var(--good-soft); }
  .dot.off { background:var(--muted); box-shadow:none; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface); cursor:pointer; transition:background .15s, border-color .15s; }
  .btn:hover { background:var(--surface-2); border-color:var(--accent); }
  .btn.danger:hover { border-color:var(--bad); color:var(--bad); }
  .btn.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .btn.small { padding:3px 9px; font-size:12px; border-radius:7px; }

  main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(300px, 400px) 1fr; gap:16px; padding:16px 20px 20px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .searchbar { display:flex; gap:8px; padding:10px; border-bottom:1px solid var(--line); background:var(--surface-2); }
  .searchbar input { flex:1; min-width:0; padding:7px 11px; border-radius:9px; border:1px solid var(--line); background:var(--surface); outline:none; }
  .searchbar input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  #list { overflow:auto; flex:1; }
  .item { display:grid; grid-template-columns:36px 1fr auto; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); cursor:pointer; position:relative; }
  .item:hover { background:var(--surface-2); }
  .item.sel { background:var(--accent-soft); }
  .item.unread .subj { font-weight:650; }
  .item.unread::before { content:""; position:absolute; left:5px; top:50%; width:6px; height:6px; margin-top:-3px; border-radius:50%; background:var(--accent); }
  .avatar { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-weight:650; font-size:13px; color:#fff; }
  .subj, .meta, .snip { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { color:var(--muted); font-size:12px; }
  .snip { color:var(--muted); font-size:12.5px; }
  .when { color:var(--muted); font-size:11.5px; white-space:nowrap; }
  .empty { display:grid; place-items:center; text-align:center; padding:48px 24px; color:var(--muted); gap:6px; }
  .empty .big { font-size:34px; opacity:.55; }

  #view { overflow:auto; flex:1; }
  .head { padding:20px 24px 14px; border-bottom:1px solid var(--line); }
  .head h2 { margin:0 0 10px; font-size:19px; letter-spacing:-.015em; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:3px 14px; font-size:13px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; word-break:break-word; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-size:12px; margin:0 4px 2px 0; }
  .links { margin:16px 24px 0; padding:12px 14px; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; background:var(--accent-soft); }
  .links h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .link { display:flex; align-items:center; gap:10px; padding:5px 0; }
  .link code { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tabs { display:flex; gap:4px; padding:14px 24px 0; }
  .tab { padding:6px 12px; border-radius:8px 8px 0 0; border:1px solid transparent; border-bottom:none; background:none; cursor:pointer; color:var(--muted); }
  .tab.on { background:var(--surface-2); border-color:var(--line); color:var(--fg); font-weight:600; }
  .body { margin:0 24px 24px; padding:16px 18px; background:var(--surface-2); border:1px solid var(--line); border-radius:0 10px 10px 10px; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font:13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  iframe { width:100%; min-height:420px; border:0; background:#fff; border-radius:6px; }
  a { color:var(--accent); }
  .toast { position:fixed; bottom:22px; left:50%; transform:translate(-50%, 20px); padding:9px 16px; border-radius:10px; background:var(--fg); color:var(--bg); font-size:13px; opacity:0; pointer-events:none; transition:all .2s; }
  .toast.on { opacity:1; transform:translate(-50%, 0); }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--fg); max-width:560px; width:calc(100% - 32px); padding:22px 24px; box-shadow:var(--shadow); }
  dialog::backdrop { background:rgba(10,12,18,.5); backdrop-filter:blur(2px); }
  dialog h3 { margin:0 0 6px; } dialog table { width:100%; border-collapse:collapse; margin:10px 0; font-size:13px; }
  dialog td { padding:6px 8px; border-bottom:1px solid var(--line); } dialog td:first-child { color:var(--muted); white-space:nowrap; width:1%; }
  dialog code { font:12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  kbd { font:11px ui-monospace, monospace; padding:1px 5px; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; background:var(--surface-2); }
  @media (max-width:820px) { main { grid-template-columns:1fr; overflow:auto; } .chips { margin-left:0; } #list { max-height:42vh; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 8 9 6 9-6"/></svg></div>
      <span>Mail mock <small>· dev</small></span>
    </div>
    <div class="chips" id="chips"></div>
    <button class="btn" id="help">Kết nối bằng mail client</button>
    <button class="btn danger" id="clear">Xoá hết</button>
  </header>
  <main>
    <section class="panel">
      <div class="searchbar"><input id="q" placeholder="Lọc theo người nhận, tiêu đề, nội dung…  ( / )" aria-label="Lọc thư" autocomplete="off"></div>
      <div id="list"></div>
    </section>
    <section class="panel"><div id="view"></div></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>

<script>
const $ = (s) => document.querySelector(s);
const list = $("#list"), view = $("#view"), q = $("#q");
let all = [], selected = null, mode = "text", info = {}, lastKey = "";
const read = new Set(JSON.parse(localStorage.getItem("mailmock.read") || "[]"));
const COLORS = ["#6366f1","#0ea5e9","#14b8a6","#f59e0b","#ec4899","#8b5cf6","#ef4444","#22c55e"];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const urls = (s) => [...new Set((String(s ?? "").match(/https?:\/\/[^\s<>"')]+/g) || []).map(u => u.replace(/[.,;]+$/, "")))];
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<>&"')]+(?:&amp;[^\s<>&"')]+)*/g, u => `<a href="${u.replace(/&amp;/g, "&")}" target="_blank" rel="noopener">${u}</a>`);
const color = (s) => COLORS[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const who = (m) => (m.from || "?").replace(/<.*>/, "").trim() || m.from || "?";
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 45) return "vừa xong"; if (s < 3600) return Math.round(s / 60) + " phút";
  if (s < 86400) return Math.round(s / 3600) + " giờ"; return new Date(iso).toLocaleDateString();
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 1600); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Đã sao chép"); } catch { toast("Không sao chép được"); } }

function filtered() {
  const t = q.value.trim().toLowerCase();
  return !t ? all : all.filter(m => [m.subject, m.from, m.to.join(" "), m.text].join("\n").toLowerCase().includes(t));
}

function renderChips() {
  const chip = (name, addr, hint) => {
    const on = !!addr;
    const port = on ? addr.replace(/^.*:/, "") : "";
    return `<span class="chip" data-copy="${on ? "localhost:" + port : ""}" title="${on ? "Bấm để sao chép localhost:" + port : name + " đang tắt"}"><i class="dot ${on ? "" : "off"}"></i><b>${name}</b>${on ? `<code>:${port}</code>` : "<span>tắt</span>"}</span>`;
  };
  $("#chips").innerHTML = chip("SMTP", info.smtp) + chip("IMAP", info.imap) + chip("POP3", info.pop3);
  document.querySelectorAll(".chip[data-copy]").forEach(c => c.onclick = () => c.dataset.copy && copy(c.dataset.copy));
}

function renderList() {
  const rows = filtered();
  const key = JSON.stringify(rows.map(m => [m.id, read.has(m.id)])) + selected + q.value;
  if (key === lastKey) return; lastKey = key;
  if (!rows.length) {
    list.innerHTML = all.length
      ? `<div class="empty"><div class="big">🔍</div><div>Không có thư nào khớp.</div></div>`
      : `<div class="empty"><div class="big">📭</div><div><b>Chưa có thư nào</b></div><div>Thư gửi tới SMTP của mock sẽ hiện ở đây.</div></div>`;
    return;
  }
  list.innerHTML = rows.map(m => {
    const name = who(m);
    return `<div class="item ${m.id === selected ? "sel" : ""} ${read.has(m.id) ? "" : "unread"}" data-id="${m.id}">
      <div class="avatar" style="background:${color(m.from)}">${esc(name[0]?.toUpperCase() || "?")}</div>
      <div><div class="subj">${esc(m.subject || "(không tiêu đề)")}</div>
        <div class="meta">${esc(m.to.join(", "))}</div>
        <div class="snip">${esc((m.text || "").replace(/\s+/g, " ").slice(0, 90))}</div></div>
      <div class="when">${ago(m.receivedAt)}</div></div>`;
  }).join("");
  list.querySelectorAll(".item").forEach(el => el.onclick = () => select(Number(el.dataset.id)));
}

function select(id) {
  selected = id; read.add(id); localStorage.setItem("mailmock.read", JSON.stringify([...read].slice(-500)));
  lastKey = ""; renderList(); renderView();
}

function renderView() {
  const m = all.find(x => x.id === selected);
  if (!m) { view.innerHTML = `<div class="empty"><div class="big">✉️</div><div>Chọn một thư để đọc.</div></div>`; return; }
  const found = urls(m.text || m.html);
  const hdr = (m.raw.split(/\r?\n\r?\n/)[0] || "");
  const tabs = [["text", "Nội dung"], ...(m.html ? [["html", "HTML"]] : []), ["raw", "Bản gốc"], ["headers", "Headers"]];
  if (!tabs.some(t => t[0] === mode)) mode = "text";
  const body = mode === "raw" ? `<pre>${esc(m.raw)}</pre>`
    : mode === "headers" ? `<pre>${esc(hdr)}</pre>`
    : mode === "html" ? `<iframe sandbox srcdoc="${esc(m.html)}"></iframe>`
    : `<pre>${linkify(m.text || m.html || "")}</pre>`;
  view.innerHTML = `
    <div class="head"><h2>${esc(m.subject || "(không tiêu đề)")}</h2>
      <dl class="kv"><dt>Từ</dt><dd>${esc(m.from)}</dd>
      <dt>Tới</dt><dd>${m.to.map(t => `<span class="pill">${esc(t)}</span>`).join("")}</dd>
      <dt>Lúc</dt><dd>${new Date(m.receivedAt).toLocaleString()} · mã #${m.id}</dd></dl></div>
    ${found.length ? `<div class="links"><h3>Liên kết trong thư</h3>${found.map(u => `<div class="link"><code title="${esc(u)}">${esc(u)}</code>
      <button class="btn small" data-copy="${esc(u)}">Sao chép</button><a class="btn small" href="${esc(u)}" target="_blank" rel="noopener">Mở</a></div>`).join("")}</div>` : ""}
    <div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${k === mode ? "on" : ""}" data-m="${k}">${l}</button>`).join("")}</div>
    <div class="body">${body}</div>`;
  view.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy));
  view.querySelectorAll(".tab").forEach(b => b.onclick = () => { mode = b.dataset.m; renderView(); });
}

async function load() {
  try {
    const [msgs, inf] = await Promise.all([fetch("/api/messages").then(r => r.json()), fetch("/api/info").then(r => r.json())]);
    all = msgs.data; info = inf.data; renderChips(); renderList();
    if (selected && !all.some(m => m.id === selected)) { selected = null; renderView(); }
  } catch {}
}

$("#clear").onclick = async () => {
  if (!all.length || !confirm("Xoá toàn bộ thư trong mock?")) return;
  await fetch("/api/messages", { method: "DELETE" }); selected = null; lastKey = ""; await load(); renderView();
};
$("#help").onclick = () => {
  const d = $("#dlg"), host = location.hostname;
  const row = (k, v) => `<tr><td>${k}</td><td><code>${v}</code></td></tr>`;
  d.innerHTML = `<h3>Đọc thư bằng mail client</h3>
    <p style="margin:0;color:var(--muted)">Mỗi địa chỉ nhận là một hộp thư riêng: đăng nhập bằng chính địa chỉ đó, mật khẩu nhập gì cũng được.
    Dùng <code>*</code> làm tên đăng nhập để đọc mọi thư. Xoá thư qua IMAP/POP3 chỉ ẩn nó khỏi hộp thư đó, giao diện này vẫn giữ.</p>
    <table>${row("SMTP (gửi)", `${host}:${(info.smtp || "").replace(/^.*:/, "") || "tắt"} · không TLS`)}
      ${row("IMAP", `${host}:${(info.imap || "").replace(/^.*:/, "") || "tắt"} · không TLS · chỉ có INBOX`)}
      ${row("POP3", `${host}:${(info.pop3 || "").replace(/^.*:/, "") || "tắt"} · không TLS`)}
      ${row("Tài khoản", "bob@acme.io  (mật khẩu bất kỳ)")}</table>
    <p style="margin:0;color:var(--muted)">Phím tắt: <kbd>/</kbd> lọc · <kbd>j</kbd>/<kbd>k</kbd> thư kế/trước.</p>
    <p style="text-align:right;margin:14px 0 0"><button class="btn primary" onclick="this.closest('dialog').close()">Đóng</button></p>`;
  d.showModal();
};
document.addEventListener("keydown", (e) => {
  if (e.target === q) { if (e.key === "Escape") q.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); q.focus(); }
  if (e.key === "j" || e.key === "k") {
    const rows = filtered(); if (!rows.length) return;
    const i = rows.findIndex(m => m.id === selected);
    select(rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === "j" ? 1 : -1)))].id);
  }
});
q.oninput = () => { lastKey = ""; renderList(); };
load(); setInterval(load, 2000);
</script>
</body>
</html>
