<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mail-mock</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --fg:#18181b; --muted:#71717a; --line:#e4e4e7; --accent:#2563eb; --sel:#eff6ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0b0d; --card:#151518; --fg:#e4e4e7; --muted:#a1a1aa; --line:#27272a; --accent:#60a5fa; --sel:#172033; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:15px; margin:0; }
  header .muted { margin-right:auto; }
  input, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 9px; }
  button { cursor:pointer; }
  main { display:grid; grid-template-columns:minmax(260px, 380px) 1fr; height:calc(100vh - 51px); }
  #list { overflow:auto; border-right:1px solid var(--line); background:var(--card); }
  .item { padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item.sel { background:var(--sel); }
  .item .s { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .muted { color:var(--muted); font-size:12px; }
  #view { overflow:auto; padding:18px 22px; }
  #view h2 { margin:0 0 6px; font-size:17px; }
  pre { white-space:pre-wrap; word-break:break-word; font:13px/1.5 ui-monospace, monospace; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
  a { color:var(--accent); }
  .tabs button.on { border-color:var(--accent); color:var(--accent); }
  .empty { padding:24px; color:var(--muted); }
  @media (max-width: 700px) { main { grid-template-columns:1fr; height:auto; } #list { max-height:40vh; } }
</style>
</head>
<body>
<header>
  <h1>mail-mock</h1>
  <span class="muted">Mọi thư gửi tới SMTP của mock đều nằm ở đây, không gửi đi đâu cả.</span>
  <input id="to" placeholder="Lọc theo người nhận" aria-label="Lọc theo người nhận">
  <button id="clear">Xoá hết</button>
</header>
<main>
  <div id="list"></div>
  <div id="view"><div class="empty">Chọn một thư.</div></div>
</main>
<script>
const list = document.getElementById("list"), view = document.getElementById("view"), toInput = document.getElementById("to");
let selected = null, mode = "text", last = "";

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function linkify(s) { return esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`); }

async function load() {
  const q = toInput.value.trim();
  const res = await fetch("/api/messages" + (q ? "?to=" + encodeURIComponent(q) : ""));
  const { data } = await res.json();
  const key = JSON.stringify(data.map(m => m.id)) + q;
  if (key === last) return;
  last = key;
  list.innerHTML = data.length ? "" : '<div class="empty">Chưa có thư nào.</div>';
  for (const m of data) {
    const el = document.createElement("div");
    el.className = "item" + (m.id === selected ? " sel" : "");
    el.innerHTML = `<div class="s">${esc(m.subject || "(không tiêu đề)")}</div>
      <div class="muted">${esc(m.to.join(", "))} · ${new Date(m.receivedAt).toLocaleTimeString()}</div>`;
    el.onclick = () => { selected = m.id; last = ""; show(m); load(); };
    list.appendChild(el);
  }
}

function show(m) {
  const body = mode === "raw" ? esc(m.raw) : linkify(m.text || m.html || "");
  view.innerHTML = `<h2>${esc(m.subject || "(không tiêu đề)")}</h2>
    <div class="muted">Từ ${esc(m.from)} tới ${esc(m.to.join(", "))} · ${new Date(m.receivedAt).toLocaleString()}</div>
    <p class="tabs"><button data-m="text" class="${mode === "text" ? "on" : ""}">Nội dung</button>
    <button data-m="raw" class="${mode === "raw" ? "on" : ""}">Bản gốc</button></p>
    <pre>${body}</pre>`;
  view.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { mode = b.dataset.m; show(m); });
}

document.getElementById("clear").onclick = async () => {
  await fetch("/api/messages", { method: "DELETE" });
  selected = null; last = ""; view.innerHTML = '<div class="empty">Chọn một thư.</div>'; load();
};
toInput.oninput = () => { last = ""; load(); };
load();
setInterval(load, 2000);
</script>
</body>
</html>
