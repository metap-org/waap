---
# Cảnh báo và sự cố.
# Chạy: labs/bin/waap-install alerting-service --host <ip|local> -e @vars.yml [--harden]
# Cấu hình qua app_env (không bí mật) và app_env_secret (bí mật); xem apps/examples/alerting-service.yml.
# Bắt buộc có các khoá: DATABASE_URL, RABBITMQ_URL, JWKS_URL, ANALYTICS_URL.
- name: Cài alerting-service
  hosts: all
  become: true
  vars:
    app_name: alerting-service
    app_binary_src: "{{ app_bin_dir }}/alerting-service"
    app_env_defaults: {"PORT": "3020", "GRPC_ENABLED": "true"}
    app_health_url: "http://127.0.0.1:3020/health"
    app_fw_ports: [{"proto": "tcp", "ports": [3020, 3021]}]
    required_keys: ["DATABASE_URL", "RABBITMQ_URL", "JWKS_URL", "ANALYTICS_URL"]
  pre_tasks:
    - name: Chuẩn nền hardening (khi --harden)
      ansible.builtin.import_role:
        name: baseline
      when: app_harden | bool
    - name: Đủ cấu hình bắt buộc
      ansible.builtin.assert:
        that: (required_keys | difference((app_env | default({})).keys() | list + (app_env_secret | default({})).keys() | list)) | length == 0
        fail_msg: "Thiếu khoá cấu hình, xem apps/examples/alerting-service.yml"
        quiet: true
  roles:
    - app_service
  post_tasks:
    - name: Firewall riêng của ứng dụng (khi có app_allow_from)
      ansible.builtin.include_role:
        name: app_firewall
