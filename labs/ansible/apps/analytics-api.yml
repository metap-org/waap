---
# analytics-api (Analytics plane).
# Chạy: labs/bin/waap-install analytics-api --host <ip|local> -e @vars.yml [--harden]
# Cấu hình qua app_env (không bí mật) và app_env_secret (bí mật); xem apps/examples/analytics-api.yml.
# Bắt buộc có các khoá: CLICKHOUSE_URL, JWKS_URL.
- name: Cài analytics-api
  hosts: all
  become: true
  vars:
    app_name: analytics-api
    app_binary_src: "{{ app_bin_dir }}/analytics-api"
    app_env_defaults: {"PORT": "3030"}
    app_health_url: "http://127.0.0.1:3030/health"
    app_fw_ports: [{"proto": "tcp", "ports": [3030]}]
    required_keys: ["CLICKHOUSE_URL", "JWKS_URL"]
  pre_tasks:
    - name: Chuẩn nền hardening (khi --harden)
      ansible.builtin.import_role:
        name: baseline
      when: app_harden | bool
    - name: Đủ cấu hình bắt buộc
      ansible.builtin.assert:
        that: (required_keys | difference((app_env | default({})).keys() | list + (app_env_secret | default({})).keys() | list)) | length == 0
        fail_msg: "Thiếu khoá cấu hình, xem apps/examples/analytics-api.yml"
        quiet: true
  roles:
    - app_service
  post_tasks:
    - name: Firewall riêng của ứng dụng (khi có app_allow_from)
      ansible.builtin.include_role:
        name: app_firewall
