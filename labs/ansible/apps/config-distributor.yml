---
# Biên dịch luật và ghi Redis cho edge; nhận telemetry.
# Chạy: labs/bin/waap-install config-distributor --host <ip|local> -e @vars.yml [--harden]
# Cấu hình qua app_env (không bí mật) và app_env_secret (bí mật); xem apps/examples/config-distributor.yml.
# Bắt buộc có các khoá: ZONES_URL, CONTROL_LOGIN_URL, CONTROL_SERVICE_EMAIL, CONTROL_SERVICE_PASSWORD, REDIS_URL, AMQP_URL, ANALYTICS_URL.
- name: Cài config-distributor
  hosts: all
  become: true
  vars:
    app_name: waf-config-distributor
    app_binary_src: "{{ app_bin_dir }}/waf-config-distributor"
    app_env_defaults: {"PORT": "4100"}
    app_health_url: "http://127.0.0.1:4100/health"
    app_fw_ports: [{"proto": "tcp", "ports": [4100]}]
    required_keys: ["ZONES_URL", "CONTROL_LOGIN_URL", "CONTROL_SERVICE_EMAIL", "CONTROL_SERVICE_PASSWORD", "REDIS_URL", "AMQP_URL", "ANALYTICS_URL"]
  pre_tasks:
    - name: Chuẩn nền hardening (khi --harden)
      ansible.builtin.import_role:
        name: baseline
      when: app_harden | bool
    - name: Đủ cấu hình bắt buộc
      ansible.builtin.assert:
        that: (required_keys | difference((app_env | default({})).keys() | list + (app_env_secret | default({})).keys() | list)) | length == 0
        fail_msg: "Thiếu khoá cấu hình, xem apps/examples/config-distributor.yml"
        quiet: true
  roles:
    - app_service
  post_tasks:
    - name: Firewall riêng của ứng dụng (khi có app_allow_from)
      ansible.builtin.include_role:
        name: app_firewall
