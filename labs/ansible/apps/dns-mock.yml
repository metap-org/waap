---
# DNS và DoH giả cho dev/staging. Binary từ lab build.
# Chạy: labs/bin/waap-install dns-mock --host <ip|local> [-e biến=giá-trị ...] [--harden]
- name: Cài dns-mock
  hosts: all
  become: true
  vars:
    dns_mock_binary_src: "{{ app_bin_dir }}/dns-mock"
    app_fw_ports: [{"proto": "tcp", "ports": [53, 8053]}, {"proto": "udp", "ports": [53]}]
  pre_tasks:
    - name: Chuẩn nền hardening (khi --harden)
      ansible.builtin.import_role:
        name: baseline
      when: app_harden | bool
  roles:
    - svc_dns_mock
  post_tasks:
    - name: Firewall riêng của ứng dụng (khi có app_allow_from)
      ansible.builtin.include_role:
        name: app_firewall
