---
# squid ra Internet có allowlist, chặn dải riêng và metadata.
# Chạy: labs/bin/waap-install egress --host <ip|local> [-e biến=giá-trị ...] [--harden]
- name: Cài egress
  hosts: all
  become: true
  vars:
    egress_allowed_src: "{{ app_allow_from }}"
    app_fw_ports: [{"proto": "tcp", "ports": [3128]}]
  pre_tasks:
    - name: Chuẩn nền hardening (khi --harden)
      ansible.builtin.import_role:
        name: baseline
      when: app_harden | bool
  roles:
    - svc_perimeter
  post_tasks:
    - name: Firewall riêng của ứng dụng (khi có app_allow_from)
      ansible.builtin.include_role:
        name: app_firewall
