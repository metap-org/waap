---
# Node k3s (server hoặc agent: -e k3s_role=agent -e k3s_api_endpoint=...). Cần k3s_version, k3s_sha256, k3s_token.
# Chạy: labs/bin/waap-install k3s-node --host <ip|local> [-e biến=giá-trị ...] [--harden]
- name: Cài k3s-node
  hosts: all
  become: true
  vars:
    app_fw_ports: [{"proto": "tcp", "ports": [6443, 10250]}]
  pre_tasks:
    - name: Chuẩn nền hardening (khi --harden)
      ansible.builtin.import_role:
        name: baseline
      when: app_harden | bool
  roles:
    - profile_k8s_node
  post_tasks:
    - name: Firewall riêng của ứng dụng (khi có app_allow_from)
      ansible.builtin.include_role:
        name: app_firewall
