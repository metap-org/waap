---
# Origin giả để thử proxy.
# Chạy: labs/bin/waap-install origin --host <ip|local> [-e biến=giá-trị ...] [--harden]
- name: Cài origin
  hosts: all
  become: true
  vars:
    app_fw_ports: [{"proto": "tcp", "ports": [80]}]
  pre_tasks:
    - name: Chuẩn nền hardening (khi --harden)
      ansible.builtin.import_role:
        name: baseline
      when: app_harden | bool
  roles:
    - svc_origin
  post_tasks:
    - name: Firewall riêng của ứng dụng (khi có app_allow_from)
      ansible.builtin.include_role:
        name: app_firewall
