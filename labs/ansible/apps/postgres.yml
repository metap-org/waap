---
# PostgreSQL 16, scram, TLS, chỉ nhận từ app_allow_from.
# Chạy: labs/bin/waap-install postgres --host <ip|local> [-e biến=giá-trị ...] [--harden]
- name: Cài postgres
  hosts: all
  become: true
  vars:
    pg_allowed_cidrs: "{{ app_allow_from }}"
    app_fw_ports: [{"proto": "tcp", "ports": [5432]}]
  pre_tasks:
    - name: Chuẩn nền hardening (khi --harden)
      ansible.builtin.import_role:
        name: baseline
      when: app_harden | bool
  roles:
    - svc_postgres
  post_tasks:
    - name: Firewall riêng của ứng dụng (khi có app_allow_from)
      ansible.builtin.include_role:
        name: app_firewall
