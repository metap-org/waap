---
# RabbitMQ, không guest, tài khoản ứng dụng.
# Chạy: labs/bin/waap-install rabbitmq --host <ip|local> [-e biến=giá-trị ...] [--harden]
- name: Cài rabbitmq
  hosts: all
  become: true
  vars:
    app_fw_ports: [{"proto": "tcp", "ports": [5672]}]
  pre_tasks:
    - name: Chuẩn nền hardening (khi --harden)
      ansible.builtin.import_role:
        name: baseline
      when: app_harden | bool
  roles:
    - svc_rabbitmq
  post_tasks:
    - name: Firewall riêng của ứng dụng (khi có app_allow_from)
      ansible.builtin.include_role:
        name: app_firewall
