---
# Redis có ACL: user control ghi, user edge chỉ đọc waf:*. Dùng cho valkey-edge và valkey-central.
# Chạy: labs/bin/waap-install redis --host <ip|local> [-e biến=giá-trị ...] [--harden]
- name: Cài redis
  hosts: all
  become: true
  vars:
    app_fw_ports: [{"proto": "tcp", "ports": [6379]}]
  pre_tasks:
    - name: Chuẩn nền hardening (khi --harden)
      ansible.builtin.import_role:
        name: baseline
      when: app_harden | bool
  roles:
    - svc_redis
  post_tasks:
    - name: Firewall riêng của ứng dụng (khi có app_allow_from)
      ansible.builtin.include_role:
        name: app_firewall
