---
# Mặc định cho mọi node. Ghi đè theo nhóm vai trò ở group_vars/role_*.yml.
# Kết nối: lab bootstrap dùng `incus exec` qua plugin community.general.incus; sau P2 chuyển sang SSH qua bastion.
ansible_connection: community.general.incus
ansible_incus_remote: local
ansible_incus_host: "{{ inventory_hostname }}"
app_listen_ip: "{{ lab_ip }}"     # lab: IP trong vùng; cài độc lập (apps/) lấy IP mặc định của máy
lab_bootstrap: true           # true: còn khoá SSH tĩnh, apt ra Internet trực tiếp. `lab seal` đặt false.
lab_generated_dir: "{{ playbook_dir }}/../infra/generated"
# --- truy cập ---
ssh_user_ca_pub_file: "{{ lab_generated_dir }}/ssh_user_ca.pub"   # `lab ssh-ca` sinh; P5 chuyển sang OpenBao ký
ssh_allow_static_keys: "{{ lab_bootstrap }}"
# --- hệ thống (mặc định chuẩn nằm ở roles/baseline/defaults) ---
hostfw_enabled: true
ntp_servers: "{{ ['ntp.ubuntu.com'] if (lab_bootstrap or not lab_infra_ip) else [lab_infra_ip] }}"
