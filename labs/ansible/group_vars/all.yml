---
# Mặc định cho mọi node. Ghi đè theo nhóm vai trò ở group_vars/role_*.yml.
# Kết nối: lab bootstrap dùng `incus exec` qua plugin community.general.incus; sau P2 chuyển sang SSH qua bastion.
ansible_connection: community.general.incus
ansible_incus_remote: local
ansible_incus_host: "{{ inventory_hostname }}"
app_listen_ip: "{{ lab_ip }}"     # lab: IP trong vùng; cài độc lập (apps/) lấy IP mặc định của máy
lab_bootstrap: true           # true: còn khoá SSH tĩnh, apt ra Internet trực tiếp. `lab seal` đặt false.
# Mirror nội bộ ở registry và apt-cacher-ng: dùng khi đã seal và đã có registry. Lúc bootstrap kéo thẳng từ vendor.
# Z1 và Z5 không tới được registry (X01, X05): Z1 đi qua egress-1 (M03), Z5 nhận gói bằng task đẩy (push.yml).
mirror_base: "{{ ('http://' ~ lab_registry_ip) if (not lab_bootstrap and lab_registry_ip | default('') | length > 0 and lab_zone in ['Z2', 'Z3', 'Z4', 'Z6']) else '' }}"
# Vá Ubuntu: Z2, Z3, Z4, Z6 qua apt-cacher-ng của registry (M01); Z1 qua squid ở egress-1 (M03, allowlist); Z5 không có đường nào (X05), dùng push.yml.
apt_proxy: "{{ ('http://' ~ lab_registry_ip ~ ':3142') if (not lab_bootstrap and lab_registry_ip | default('') | length > 0 and lab_zone in ['Z2', 'Z3', 'Z4', 'Z6']) else (('http://' ~ lab_egress_ip ~ ':3128') if (not lab_bootstrap and lab_zone == 'Z1') else '') }}"
# Proxy HTTPS cho tải tarball/khoá trực tiếp từ vendor (chỉ Z1, vì không có mirror).
download_proxy: "{{ ('http://' ~ lab_egress_ip ~ ':3128') if (not lab_bootstrap and lab_zone == 'Z1') else '' }}"
lab_generated_dir: "{{ playbook_dir }}/../infra/generated"
# --- truy cập ---
ssh_user_ca_pub_file: "{{ lab_generated_dir }}/ssh_user_ca.pub"   # `lab ssh-ca` sinh; P5 chuyển sang OpenBao ký
ssh_allow_static_keys: "{{ lab_bootstrap }}"
# --- hệ thống (mặc định chuẩn nằm ở roles/baseline/defaults) ---
hostfw_enabled: true
ntp_servers: "{{ ['ntp.ubuntu.com'] if (lab_bootstrap or not lab_infra_ip) else [lab_infra_ip] }}"
