---
# Dịch vụ Go chạy bằng systemd trên một máy bất kỳ (không cần K8s, không cần vùng). Bắt buộc: app_name, app_binary_src.
app_user: "{{ app_name }}"
app_env: {}                 # biến môi trường không bí mật
app_env_secret: {}          # biến môi trường bí mật (ghi vào tệp 0640 root:<user>)
app_exec_args: ""
app_capabilities: []        # ví dụ [CAP_NET_BIND_SERVICE] khi nghe cổng dưới 1024
app_memory_max: 512M
app_extra_dirs: []          # [{path, mode}] thư mục dữ liệu thuộc user
app_files: []               # [{src, dest, mode}] tệp cần chép (ví dụ khoá JWKS)
app_health_url: ""          # có giá trị thì đợi 200 sau khi chạy
app_health_retries: 20
