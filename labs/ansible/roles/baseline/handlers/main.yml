---
- name: Restart ssh
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  listen: restart ssh

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  listen: reload sysctl

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  listen: load audit rules

- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted
  listen: restart chrony
