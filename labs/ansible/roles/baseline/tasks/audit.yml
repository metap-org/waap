---
- name: Luật auditd
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/90-waap.rules
    mode: "0640"
    owner: root
    group: root
  notify: load audit rules

- name: auditd chạy
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

- name: Khởi tạo cơ sở dữ liệu AIDE (lần đầu, mất vài phút)
  ansible.builtin.shell: aideinit -y -f && cp -f /var/lib/aide/aide.db.new /var/lib/aide/aide.db
  args:
    creates: /var/lib/aide/aide.db
  when: baseline_aide_enabled | bool
  changed_when: true
  tags: [aide]

- name: Kiểm AIDE hằng ngày (cảnh báo khi đổi ngoài Ansible)
  ansible.builtin.systemd:
    name: dailyaidecheck.timer
    enabled: true
    state: started
  when: baseline_aide_enabled | bool
  failed_when: false
  tags: [aide]
