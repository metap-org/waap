---
# ADR-0048 hồ sơ data: đĩa riêng cho dữ liệu, WAL, log; I/O scheduler phù hợp; tài khoản backup riêng.
# Mã hoá đĩa (LUKS) là biến luks_enabled của role disks, mặc định tắt ở lab (xem defaults của role đó).
- name: Tài khoản backup riêng, không đăng nhập được
  ansible.builtin.user:
    name: "{{ data_backup_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
- name: Thư mục gốc dữ liệu chỉ chủ sở hữu
  ansible.builtin.file:
    path: "{{ data_root }}"
    state: directory
    mode: "0750"
    owner: root
    group: "{{ data_backup_user }}"
