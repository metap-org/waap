---
# Không đường ra Internet: do hostfw khoá output cho vai trò edge-waf (khi máy không đồng thời là edge-l7).
- name: Người dùng dịch vụ WAF
  ansible.builtin.user:
    name: "{{ waf_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Slice riêng (CPU và bộ nhớ không tranh với L7)
  ansible.builtin.template:
    src: waap-waf.slice.j2
    dest: /etc/systemd/system/waap-waf.slice
    mode: "0644"
    owner: root
    group: root
  notify: daemon reload

- name: Unit waap-waf trong slice
  ansible.builtin.template:
    src: waap-waf.service.j2
    dest: /etc/systemd/system/waap-waf.service
    mode: "0644"
    owner: root
    group: root
  notify: daemon reload

- name: Hardening unit
  ansible.builtin.include_role:
    name: hardened_unit
  vars:
    hu_unit: waap-waf
    hu_capabilities: []
    hu_memory_max: "{{ waf_memory_max }}"
