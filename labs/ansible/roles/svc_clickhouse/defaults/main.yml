---
# ClickHouse không có trong apt của Ubuntu. Ghim các gói .deb và checksum từ trang phát hành (tự kiểm), như k3s.
# Mỗi phần tử: {url, sha256}. Thứ tự cài: common-static, server, client.
clickhouse_debs: []
clickhouse_data: /var/lib/clickhouse
clickhouse_listen: "{{ app_listen_ip }}"
clickhouse_ttl_days: 30
clickhouse_allowed_cidrs: ["10.10.30.0/24"]   # nguồn được dùng tài khoản default; đặt theo nơi cài
