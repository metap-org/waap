---
- name: Cần địa chỉ edge
  ansible.builtin.assert:
    that: loadgen_edge_ip | length > 0
    fail_msg: "Truyền loadgen_edge_ip."
    quiet: true

- name: Công cụ tải
  ansible.builtin.apt:
    name: [curl, apache2-utils]
    state: present

- name: Kịch bản tải (bình thường và giống tấn công)
  ansible.builtin.template:
    src: waap-loadgen.sh.j2
    dest: /usr/local/bin/waap-loadgen
    mode: "0755"
