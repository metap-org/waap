---
- name: nginx cho origin giả
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Trang gốc và /echo trả lại header nhận được
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/origin.conf
    mode: "0644"
    content: |
      server {
        listen {{ lab_ip }}:80 default_server;
        server_tokens off;
        location = /echo { default_type text/plain; return 200 "origin ok\nhost=$host\nxff=$http_x_forwarded_for\nua=$http_user_agent\n"; }
        location / { default_type text/plain; return 200 "origin\n"; }
      }
  notify: restart nginx

- name: Bỏ site mặc định
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx

- name: Chạy
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
