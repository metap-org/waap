---
# Cài từ repo PGDG chính thức của PostgreSQL (apt.postgresql.org), không dùng gói của Ubuntu.
# Nâng version nhỏ: đặt pg_pkg_version (ví dụ "17.5-1.pgdg24.04+1") rồi chạy lại. Nâng version lớn: xem labs/UPGRADE.md.
pg_version: 17
pg_pkg_version: ""      # rỗng: bản mới nhất của repo lúc cài lần đầu; sau đó gói bị hold nên không tự đổi
pg_repo_key_fingerprint: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
# Mặc định theo gói Debian; lab đặt đĩa dữ liệu và WAL riêng bằng cách ghi đè hai biến này.
pg_data: "/var/lib/postgresql/{{ pg_version }}/main"
pg_wal: ""
pg_db: metap
pg_user: metap
# Mật khẩu lấy từ lab_secrets (lab chỉ; P5 chuyển sang OpenBao dynamic secret).
pg_password: "{{ lab_secrets.postgres_password if lab_secrets is defined else lookup('ansible.builtin.password', app_secret_dir ~ '/' ~ inventory_hostname ~ '/postgres_password length=24 chars=ascii_letters,digits') }}"
pg_allowed_cidrs: ["10.10.30.0/24"]   # Z3 (N14)
