---
- name: Gói PostgreSQL
  ansible.builtin.apt:
    name: ["postgresql-{{ pg_version }}", python3-psycopg2, ssl-cert]
    state: present

- name: Cụm mới trên đĩa dữ liệu và đĩa WAL riêng (thay cụm mặc định)
  ansible.builtin.shell: |
    set -e
    pg_dropcluster --stop {{ pg_version }} main || true
    install -d -o postgres -g postgres -m 0700 {{ pg_data | dirname }}/ {{ pg_wal | dirname }}/
    pg_createcluster {{ pg_version }} main -d {{ pg_data }} --start -- --waldir={{ pg_wal }} --data-checksums
  args:
    creates: "{{ pg_data }}/PG_VERSION"
    executable: /bin/bash

- name: Cấu hình (nghe trên IP lab, TLS, scram, ghi log kết nối)
  ansible.builtin.template:
    src: waap.conf.j2
    dest: "/etc/postgresql/{{ pg_version }}/main/conf.d/90-waap.conf"
    mode: "0644"
    owner: postgres
    group: postgres
  notify: restart postgres

- name: pg_hba chỉ từ vùng ứng dụng, bắt buộc TLS
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
    mode: "0640"
    owner: postgres
    group: postgres
  notify: restart postgres

- name: Áp dụng cấu hình trước khi tạo tài khoản
  ansible.builtin.meta: flush_handlers

- name: Tài khoản ứng dụng
  community.postgresql.postgresql_user:
    name: "{{ pg_user }}"
    password: "{{ pg_password }}"
    role_attr_flags: CREATEDB
  become: true
  become_user: postgres
  no_log: true

- name: Cơ sở dữ liệu
  community.postgresql.postgresql_db:
    name: "{{ pg_db }}"
    owner: "{{ pg_user }}"
  become: true
  become_user: postgres
