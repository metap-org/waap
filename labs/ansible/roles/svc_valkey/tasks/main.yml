---
- name: Cần phiên bản và sha256 đã ghim
  ansible.builtin.assert:
    that:
      - valkey_version | length > 0
      - valkey_sha256 | length == 64
    fail_msg: "Ghim valkey_version và valkey_sha256 (từ trang release của valkey.io, tự kiểm). Không tải binary chưa kiểm."
    quiet: true

- name: Người dùng dịch vụ không đăng nhập được
  ansible.builtin.user:
    name: "{{ valkey_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ valkey_dir }}"
    create_home: false

- name: Thư mục dữ liệu, cấu hình, phiên bản
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ valkey_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ valkey_dir }}", owner: "{{ valkey_user }}", mode: "0750" }
    - { path: /etc/valkey, owner: root, mode: "0750" }
    - { path: "{{ valkey_home }}", owner: root, mode: "0755" }
    - { path: "{{ valkey_home }}/{{ valkey_version }}", owner: root, mode: "0755" }

- name: Tải binary đã ghim và kiểm checksum
  ansible.builtin.get_url:
    url: "{{ valkey_tarball_url }}"
    dest: "/var/cache/valkey-{{ valkey_version }}.tar.gz"
    checksum: "sha256:{{ valkey_sha256 }}"
    mode: "0644"
  environment: "{{ {'https_proxy': download_proxy} if download_proxy | default('') | length > 0 else {} }}"

- name: Giải nén vào thư mục của version
  ansible.builtin.unarchive:
    src: "/var/cache/valkey-{{ valkey_version }}.tar.gz"
    dest: "{{ valkey_home }}/{{ valkey_version }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
    creates: "{{ valkey_home }}/{{ valkey_version }}/bin/valkey-server"

- name: Trỏ current về version này (đổi symlink là nâng hoặc hoàn tác)
  ansible.builtin.file:
    src: "{{ valkey_home }}/{{ valkey_version }}"
    dest: "{{ valkey_home }}/current"
    state: link
  notify: restart valkey

- name: Lệnh valkey-cli và valkey-server trong PATH
  ansible.builtin.file:
    src: "{{ valkey_home }}/current/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: [valkey-cli, valkey-server]

- name: Cấu hình Valkey (ACL, không loại bỏ khoá, AOF)
  ansible.builtin.template:
    src: valkey.conf.j2
    dest: /etc/valkey/valkey.conf
    mode: "0640"
    owner: root
    group: "{{ valkey_user }}"
  no_log: true
  notify: restart valkey

- name: Unit systemd
  ansible.builtin.template:
    src: valkey-server.service.j2
    dest: /etc/systemd/system/valkey-server.service
    mode: "0644"
    owner: root
    group: root
  notify: [reload systemd, restart valkey]

- name: Sandbox của unit (ghi chỉ vào thư mục dữ liệu)
  ansible.builtin.include_role:
    name: hardened_unit
  vars:
    hu_unit: valkey-server
    hu_capabilities: []
    hu_memory_max: ""
    hu_read_write_paths: ["{{ valkey_dir }}"]
    hu_extra: "MemoryDenyWriteExecute=false"

- name: Chạy
  ansible.builtin.systemd:
    name: valkey-server
    enabled: true
    state: started
    daemon_reload: true
