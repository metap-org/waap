---
# Hạ tầng dữ liệu và biên (P1 lát 2). Dừng ở mức database và proxy ra; KHÔNG triển khai dịch vụ ứng dụng.
# Chạy sau site.yml:  ansible-playbook services.yml -e @../infra/generated/secrets.yml
- name: PostgreSQL
  hosts: role_postgres
  roles:
    - role: svc_postgres
      tags: [postgres]

- name: RabbitMQ
  hosts: role_rabbitmq
  roles:
    - role: svc_rabbitmq
      tags: [rabbitmq]

- name: Redis (valkey-central và valkey-edge)
  hosts: role_valkey_central:role_valkey_edge
  roles:
    - role: svc_redis
      tags: [redis]

- name: ClickHouse
  hosts: role_clickhouse
  roles:
    - role: svc_clickhouse
      tags: [clickhouse]

- name: egress-1 (proxy ra có allowlist)
  hosts: role_egress_1
  roles:
    - role: svc_perimeter
      tags: [egress]
