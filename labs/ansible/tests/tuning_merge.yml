---
# In ra kết quả gộp tuning cho một danh sách nhóm: ansible-playbook -c local -i localhost, tests/tuning_merge.yml -e '{"tuning_groups":["role_postgres"]}'
- hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Gộp
      ansible.builtin.include_role:
        name: os_tuning
        tasks_from: merge.yml
    - name: In kết quả dạng JSON
      ansible.builtin.copy:
        content: "{{ {'sysctl': tuning_sysctl | default({}), 'thp': tuning_thp | default(''), 'limits': tuning_limits | default({})} | to_json }}"
        dest: "{{ out_file }}"
        mode: "0644"
