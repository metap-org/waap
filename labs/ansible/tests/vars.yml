ssh_allow_static_keys: false
ssh_allow_tcp_forwarding: false
bastion_mfa: true
sysctl_ip_forward: 0
audit_immutable: true
ntp_servers: [10.10.60.12]
rke2_role: server
lab_ip: 10.10.30.11
rke2_api_endpoint: https://10.10.30.11:9345
rke2_server_ips: [10.10.30.11]
ansible_managed: "Quản lý bởi Ansible"
wg_address: 10.10.99.1/24
wg_listen_port: 51820
wg_peers: [{ name: admin, public_key: AAAA, allowed_ip: 10.10.99.2/32 }]
hu_capabilities: [CAP_NET_BIND_SERVICE]
