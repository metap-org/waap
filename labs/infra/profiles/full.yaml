# Profile full (128 GB RAM máy chủ, khoảng 90 GB cho lab, máy Linux riêng). BẢN NHÁP chờ chủ dự án review: số liệu là ước lượng thô, chưa đo.
# Khác compact: hai PoP edge, K8s HA 3 server, etcd HA, mã hoá lưu lượng pod, OpenBao 3 node, PostgreSQL có node thứ hai,
# mọi kho dữ liệu một máy riêng, vùng biên và vùng vận hành tách vai trò.
# host = octet cuối của IP trong dải vùng; .1 của mỗi vùng dành cho fw-1.
profile: full
vms:
  - { name: fw-1,        zones: [Z0, Z1, Z2, Z3, Z4, Z5, Z6], host: 1, cpu: 2, mem: 1GiB,  disk: 8GiB,  roles: [firewall] }
  # Z1 Edge DMZ: hai PoP (edge-l7-1 và edge-l7-2), mỗi PoP một L7; WAF, DNS và Redis đồng bộ rate limit dùng chung
  - { name: edge-l7-1,   zones: [Z1], host: 11, cpu: 2, mem: 2GiB,  disk: 20GiB, roles: [edge-l7],
      disks: [{ name: cache, size: 10GiB, mount: /var/cache/waap-edge }],
      vars: { edge_memory_max: 1G } }
  - { name: edge-l7-2,   zones: [Z1], host: 12, cpu: 2, mem: 2GiB,  disk: 20GiB, roles: [edge-l7],
      disks: [{ name: cache, size: 10GiB, mount: /var/cache/waap-edge }],
      vars: { edge_memory_max: 1G } }
  - { name: edge-waf-1,  zones: [Z1], host: 13, cpu: 2, mem: 2GiB,  disk: 12GiB, roles: [edge-waf],
      vars: { waf_cpus: "0-1", waf_cpu_quota: "200%", waf_memory_max: 1500M } }
  - { name: dns-1,       zones: [Z1], host: 14, cpu: 1, mem: 512MiB, disk: 8GiB, roles: [dns] }
  - { name: valkey-edge, zones: [Z1], host: 15, cpu: 1, mem: 1GiB,  disk: 8GiB,  roles: [valkey-edge] }
  # Z2 Biên: ba vai trò tách máy
  - { name: ingress-1,   zones: [Z2], host: 11, cpu: 1, mem: 1GiB,  disk: 8GiB,  roles: [ingress-1] }
  - { name: egw-1,       zones: [Z2], host: 12, cpu: 1, mem: 1GiB,  disk: 8GiB,  roles: [egw-1] }
  - { name: egress-1,    zones: [Z2], host: 13, cpu: 1, mem: 1GiB,  disk: 8GiB,  roles: [egress-1] }
  # Z3 Ứng dụng: K8s HA, 3 server (etcd HA) và 3 worker
  - { name: k8s-cp-1,    zones: [Z3], host: 11, cpu: 2, mem: 4GiB,  disk: 40GiB, roles: [k8s-cp], vars: { rke2_pod_encryption: true } }
  - { name: k8s-cp-2,    zones: [Z3], host: 12, cpu: 2, mem: 4GiB,  disk: 40GiB, roles: [k8s-cp], vars: { rke2_pod_encryption: true } }
  - { name: k8s-cp-3,    zones: [Z3], host: 13, cpu: 2, mem: 4GiB,  disk: 40GiB, roles: [k8s-cp], vars: { rke2_pod_encryption: true } }
  - { name: k8s-wk-1,    zones: [Z3], host: 21, cpu: 4, mem: 8GiB,  disk: 60GiB, roles: [k8s-app] }
  - { name: k8s-wk-2,    zones: [Z3], host: 22, cpu: 4, mem: 8GiB,  disk: 60GiB, roles: [k8s-app] }
  - { name: k8s-wk-3,    zones: [Z3], host: 23, cpu: 4, mem: 8GiB,  disk: 60GiB, roles: [k8s-app] }
  # Z4 Dữ liệu: mỗi kho một máy
  - { name: pg-1,        zones: [Z4], host: 11, cpu: 2, mem: 6GiB,  disk: 20GiB, roles: [postgres],
      disks: [{ name: data, size: 100GiB, mount: /var/lib/waap/data }, { name: wal, size: 20GiB, mount: /var/lib/waap/wal }] }
  - { name: pg-2,        zones: [Z4], host: 12, cpu: 2, mem: 6GiB,  disk: 20GiB, roles: [postgres],
      disks: [{ name: data, size: 100GiB, mount: /var/lib/waap/data }, { name: wal, size: 20GiB, mount: /var/lib/waap/wal }] }
  - { name: ch-1,        zones: [Z4], host: 13, cpu: 4, mem: 8GiB,  disk: 20GiB, roles: [clickhouse],
      disks: [{ name: data, size: 150GiB, mount: /var/lib/waap/data }] }
  - { name: kafka-1,     zones: [Z4], host: 14, cpu: 2, mem: 4GiB,  disk: 20GiB, roles: [kafka],
      disks: [{ name: data, size: 60GiB, mount: /var/lib/waap/data }] }
  - { name: mq-1,        zones: [Z4], host: 15, cpu: 2, mem: 3GiB,  disk: 20GiB, roles: [rabbitmq] }
  - { name: cache-1,     zones: [Z4], host: 16, cpu: 1, mem: 1GiB,  disk: 20GiB, roles: [valkey-central] }
  - { name: s3-1,        zones: [Z4], host: 17, cpu: 2, mem: 2GiB,  disk: 20GiB, roles: [object-storage],
      disks: [{ name: data, size: 100GiB, mount: /var/lib/waap/data }] }
  # Z5 Secret: OpenBao 3 node Raft
  - { name: bao-1,       zones: [Z5], host: 11, cpu: 1, mem: 1GiB,  disk: 8GiB,  roles: [openbao], disks: [{ name: audit, size: 2GiB, mount: /var/log/openbao-audit }] }
  - { name: bao-2,       zones: [Z5], host: 12, cpu: 1, mem: 1GiB,  disk: 8GiB,  roles: [openbao], disks: [{ name: audit, size: 2GiB, mount: /var/log/openbao-audit }] }
  - { name: bao-3,       zones: [Z5], host: 13, cpu: 1, mem: 1GiB,  disk: 8GiB,  roles: [openbao], disks: [{ name: audit, size: 2GiB, mount: /var/log/openbao-audit }] }
  # Z6 Vận hành
  - { name: bastion,     zones: [Z6], host: 11, cpu: 1, mem: 512MiB, disk: 8GiB, roles: [bastion] }
  - { name: ci-runner,   zones: [Z6], host: 12, cpu: 2, mem: 4GiB,  disk: 40GiB, roles: [ci-runner] }
  - { name: registry,    zones: [Z6], host: 13, cpu: 2, mem: 2GiB,  disk: 60GiB, roles: [registry] }
  - { name: infra,       zones: [Z6], host: 14, cpu: 1, mem: 1GiB,  disk: 12GiB, roles: [infra] }
  - { name: obs,         zones: [Z6], host: 15, cpu: 2, mem: 4GiB,  disk: 60GiB, roles: [obs] }
  # Z0 Internet giả
  - { name: origin,      zones: [Z0], host: 11, cpu: 1, mem: 512MiB, disk: 8GiB, roles: [origin] }
  - { name: loadgen,     zones: [Z0], host: 12, cpu: 4, mem: 2GiB,  disk: 8GiB,  roles: [loadgen, admin-client] }
  - { name: dns-mock,    zones: [Z0], host: 13, cpu: 1, mem: 512MiB, disk: 8GiB, roles: [dns-mock] }
