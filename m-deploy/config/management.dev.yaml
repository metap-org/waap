# management-service, for docker-compose.dev.yml. Same rules as management.yaml (keys are env names,
# the environment wins), with the dev values.
port: 3000
cors_origins: [http://localhost:5173]
trusted_proxies: [172.16.0.0/12] # the web proxy in front; see docker-compose.yml

# The token issuer: signs every token and publishes /.well-known/jwks.json.
jwks:
  keys_dir: /workspace/waap/m-deploy/keys/jwks

analytics_url: http://analytics-api:3030
# Dev only: origins and test hostnames live on localhost or in dns-mock. Production leaves this
# unset, so the origin probe and the ownership-file fetch never contact a private address.
allow_private_targets: true
# Every DNS check (domain-ownership TXT, routing CNAME) goes to the dev DNS mock instead of
# dns.google; set records at http://localhost:8053.
doh_resolver_url: http://dns-mock:8053/resolve

# Invitation and password-reset emails go to the dev mail mock (read them at http://localhost:8025);
# the links point at the Vite dev server.
smtp:
  host: mail-mock
  port: 1025
  from: "WAF Portal <no-reply@waf.local>"
public_app_url: http://localhost:5173
