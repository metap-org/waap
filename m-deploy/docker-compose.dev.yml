# Dev loop for the WAF Customer Portal: the 3 Go services + api-gateway via `go run` from the
# mounted source, plus the Vite dev server. Same prerequisites as docker-compose.yml (shared
# Postgres/RabbitMQ from ../../metap, ./keys/jwks, ./.env — see README.md "Chạy local").
#
# `go run` builds from the bind-mounted metap-org root, so a code change is picked up by
# `docker compose -f docker-compose.dev.yml restart <service>` (seconds; the Go build cache lives in
# the go-cache volume). There is no file-watching auto-reload. Don't run this and
# docker-compose.yml at the same time — they publish the same host ports.
name: waap-m-dev

x-go: &go
  image: golang:1.26
  working_dir: /workspace/waap
  volumes:
    - ../../:/workspace
    - go-cache:/root/.cache/go-build
    - go-mod:/go/pkg/mod
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-service-env: &service-env
  DATABASE_URL: postgres://metap:metap@host.docker.internal:5433/metap
  RABBITMQ_URL: amqp://metap:metap@host.docker.internal:5672
  CORS_ORIGINS: http://localhost:5173
  TRUSTED_PROXIES: 172.16.0.0/12 # the api-gateway in front; see docker-compose.yml
  # Workspace > Credentials, both homes. "In metap (encrypted)": a DEV-ONLY key (never reuse it).
  # "Secret manager": the dev Vault (OpenBao) from ../../metap's compose, `docker compose up -d
  # vault` there; without it that option just fails when used.
  SECRETS_ENCRYPTION_KEYS: dev1:XHYTjt+vXQl69Vkh7AXpZo1DbhLMrPz4Vh+YSXwzqTs=
  VAULT_ADDR: http://host.docker.internal:8200
  VAULT_TOKEN: metap-dev-root-token

x-health: &health
  interval: 30s
  timeout: 5s
  retries: 60 # the first `go run` compiles everything
  start_period: 20s

services:
  zones-service:
    <<: *go
    command: go run ./m-zones/cmd/zones-service
    ports: ["3000:3000"]
    environment:
      <<: *service-env
      PORT: "3000"
      # The token issuer: signs every token and publishes /.well-known/jwks.json.
      JWKS_KEYS_DIR: /workspace/waap/m-deploy/keys/jwks
      SCANNING_URL: http://scanning-service:3010
      ALERTING_URL: http://alerting-service:3020
      # Every DNS check (domain-ownership TXT, routing CNAME) goes to the dev DNS mock instead of
      # dns.google — set records at http://localhost:8053.
      DOH_RESOLVER_URL: http://dns-mock:8053/resolve
      # Invitation and password-reset emails go to the dev mail mock (read them at
      # http://localhost:8025); the links point at the Vite dev server.
      SMTP_HOST: mail-mock
      SMTP_PORT: "1025"
      SMTP_FROM: "WAF Portal <no-reply@waf.local>"
      PUBLIC_APP_URL: http://localhost:5173
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:3000/health"]
    depends_on:
      dns-mock: { condition: service_started }
      mail-mock: { condition: service_started }

  # Stand-in for the outside world's DNS (../devtools/dns-mock): real DNS on host :15353 (udp+tcp; container :5353 — host 5353 is usually mDNS; try
  # `dig @127.0.0.1 -p 15353 ...`), DoH + admin API + UI on :8053. State survives restarts in the
  # dns-mock volume; seeded with *.edge.waf.local -> 127.0.0.1 on first boot.
  dns-mock:
    <<: *go
    working_dir: /workspace/waap/devtools/dns-mock
    command: go run .
    ports: ["${DNS_MOCK_HOST_PORT:-15353}:5353/udp", "${DNS_MOCK_HOST_PORT:-15353}:5353/tcp", "8053:8053"]
    environment:
      DNS_MOCK_STATE_FILE: /var/lib/dns-mock/state.json
      DNS_MOCK_SEED_FILE: /workspace/waap/devtools/dns-mock/seed.dev.json
    volumes:
      - ../../:/workspace
      - go-cache:/root/.cache/go-build
      - go-mod:/go/pkg/mod
      - dns-mock:/var/lib/dns-mock

  # Stand-in for the outside world's mail relay (../devtools/mail-mock): SMTP on :1025, UI + API on
  # host :8025. Accepts every message and delivers none; messages live in memory.
  mail-mock:
    <<: *go
    working_dir: /workspace/waap/devtools/mail-mock
    command: go run .
    ports: ["1025:1025", "8025:8025"]

  scanning-service:
    <<: *go
    command: go run ./m-scanning/cmd/scanning-service
    ports: ["3010:3010"]
    environment:
      <<: *service-env
      PORT: "3010"
      JWKS_URL: http://zones-service:3000/.well-known/jwks.json
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:3010/health"]

  alerting-service:
    <<: *go
    command: go run ./m-alerting/cmd/alerting-service
    ports: ["3020:3020"]
    environment:
      <<: *service-env
      PORT: "3020"
      JWKS_URL: http://zones-service:3000/.well-known/jwks.json
      ANALYTICS_URL: http://analytics-api:3030
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:3020/health"]

  api-gateway:
    <<: *go
    command: go run ./m-gateway/cmd/api-gateway
    ports: ["4000:4000"]
    environment:
      LISTEN_ADDR: 0.0.0.0:4000
      TRUSTED_PROXIES: 172.16.0.0/12
      # Entity routes go to whichever service serves the entity (each one's /metadata/entities);
      # these prefixes say who answers the rest. Every service verifies the caller's token itself.
      UPSTREAMS: "zones=http://zones-service:3000|/health,/auth/,/me,/admin/,/platform/,/tenant-users,/preferences,/dashboards,/oauth/,/.well-known/,/scim/,/public/;scanning=http://scanning-service:3010;alerting=http://alerting-service:3020"
    depends_on:
      zones-service: { condition: service_healthy }
      scanning-service: { condition: service_healthy }
      alerting-service: { condition: service_healthy }

  # --- Analytics plane (../../a-api) — a separate plane, run here for the dev loop ---
  # ClickHouse holds security events (ADR-0020); analytics-api ingests them (from control-plane)
  # and answers the portal's reads through the gateway. Data survives restarts in the volume.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  analytics-api:
    <<: *go
    working_dir: /workspace/waap/a-api
    command: go run ./cmd/analytics-api
    ports: ["3030:3030"]
    environment:
      PORT: "3030"
      CLICKHOUSE_URL: clickhouse://default:@clickhouse:9000
      JWKS_URL: http://zones-service:3000/.well-known/jwks.json
      ANALYTICS_INGEST_TOKEN: ${ANALYTICS_INGEST_TOKEN:-}
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:3030/health"]
    depends_on:
      clickhouse: { condition: service_healthy }
      zones-service: { condition: service_healthy }

  # Vite dev server (hot reload). design-system is consumed through its built dist/, so it is
  # built first; platform-ui is consumed from source.
  web:
    extends:
      file: ../../docker-compose.dev.base.yml
      service: web-dev
    working_dir: /workspace/waap/m-web
    environment:
      GATEWAY_URL: http://api-gateway:4000
      VITE_USE_POLLING: "true"
    ports: ["5173:5173"]
    depends_on:
      api-gateway: { condition: service_started }
    command: >
      sh -c '
        cd /workspace/design-system && pnpm install --frozen-lockfile && pnpm build &&
        cd /workspace/platform-ui && pnpm install --frozen-lockfile &&
        cd /workspace/waap/m-web && pnpm install --frozen-lockfile && pnpm exec vite --host 0.0.0.0
      '

volumes:
  go-cache:
  go-mod:
  dns-mock:
  clickhouse:
