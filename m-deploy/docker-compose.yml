# The WAF Customer Portal backend + web (production-mode images). Uses the shared dev
# Postgres/RabbitMQ that ../../metap/docker-compose.yml runs (`docker compose up -d postgres
# rabbitmq` there, host ports 5433/5672), reached through host.docker.internal.
#
# Before the first `docker compose up --build` (from this directory):
#   1. keys:   (cd ../../metap && go run ./cmd/dev-tools gen-jwks-key ../waap/m-deploy/keys/jwks)
#              — management-service is the only token issuer; everyone else verifies via its JWKS.
#   2. tenant + users: see README.md "Chạy local". The web proxy holds no credential of its own:
#      every request carries the caller's token, verified by management-service.
#
# Every build uses `context: ../../` (the metap-org root): ./Dockerfile needs ../../metap for
# go.mod's replace, web/Dockerfile needs design-system/platform-ui/metap-themes.
x-service: &service
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./keys:/app/keys:ro

x-service-env: &service-env
  DATABASE_URL: postgres://metap:metap@host.docker.internal:5433/metap
  RABBITMQ_URL: amqp://metap:metap@host.docker.internal:5672
  # Workspace > Credentials. SECRETS_ENCRYPTION_KEYS ("id:base64key[,old...]", 32-byte keys; first
  # is active) enables "stored in metap, encrypted"; VAULT_ADDR+VAULT_TOKEN (or AWS_SECRETS_* /
  # GCP_SECRETS_PROJECT_ID) enable "secret manager". Set either or both in .env.
  SECRETS_ENCRYPTION_KEYS: ${SECRETS_ENCRYPTION_KEYS:-}
  VAULT_ADDR: ${VAULT_ADDR:-}
  VAULT_TOKEN: ${VAULT_TOKEN:-}

services:
  management-service:
    <<: *service
    build: { context: ../../, dockerfile: waap/m-deploy/Dockerfile, args: { SERVICE: m-management/cmd/management-service } }
    ports: ["3000:3000"]
    environment:
      <<: *service-env
      # Everything that is not a secret is in config/management.yaml; a variable set here (from
      # .env) wins over it. An empty value counts as unset, so the file's value stays.
      CONFIG_FILE: /etc/waap/management.yaml
      OPERATOR_TENANT_ID: ${OPERATOR_TENANT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
    volumes:
      - ./keys:/app/keys:ro
      - ./config/management.yaml:/etc/waap/management.yaml:ro
    healthcheck: &health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # --- Analytics plane (../../a-api) — separate plane, bundled here for local runs ---
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  analytics-api:
    build: { context: ../../, dockerfile: waap/a-api/Dockerfile }
    ports: ["3030:3030"]
    environment:
      PORT: "3030"
      CLICKHOUSE_URL: clickhouse://default:@clickhouse:9000
      JWKS_URL: http://management-service:3000/.well-known/jwks.json
      ANALYTICS_INGEST_TOKEN: ${ANALYTICS_INGEST_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3030/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      clickhouse: { condition: service_healthy }
      management-service: { condition: service_healthy }

  # Production-mode web (pnpm build + nginx). For the Vite dev server use docker-compose.dev.yml.
  web:
    build: { context: ../../, dockerfile: waap/m-web/Dockerfile }
    ports: ["8081:80"]
    depends_on:
      management-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  clickhouse:
