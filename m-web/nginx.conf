# Production-mode counterpart of vite.config.ts's dev proxy: the static SPA, and every backend
# route proxied to management-service (../m-management), the one process that serves them all. The
# upstream hostname is the docker-compose service name from ../m-deploy/
# docker-compose.yml (same compose network); this file is baked into the image at build time.

# A browser opening (or reloading) a page whose path starts like a proxied API prefix
# (`/admin/users`, `/admin/roles`, `/admin/policies`, `/admin/cron-jobs`, `/auth/oidc/callback`)
# gets the SPA, not the backend's 404/401: GET or HEAD with `Accept: text/html`, which the app's
# own `fetch` calls never send. Kept on the backend: the browser legs of single sign-on, which
# redirect to or come back from the IdP (`/auth/{oidc,oauth2}/<tenant>/login`,
# `/auth/sso/{start,callback}`). Same rule as vite.config.ts's isSpaNavigation for `vite dev`.
# Regex entries are tried in order, first match wins.
map $http_accept $wants_html {
    default 0;
    "~*text/html" 1;
}
map "$request_method:$wants_html:$uri" $spa_navigation {
    default 0;
    "~^(GET|HEAD):1:/auth/(oidc|oauth2)/[^/]+/login/?$" 0;
    "~^(GET|HEAD):1:/auth/sso/(start|callback)/?$" 0;
    "~^(GET|HEAD):1:/(api|admin|auth|me|platform|tenant-users|preferences|dashboards|metadata|oauth|scim|public|health)(/|$)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # See the $spa_navigation map above; evaluated before any location below is chosen.
    if ($spa_navigation) {
        rewrite ^ /index.html last;
    }

    # The proxy target is a variable and `resolver` is Docker's embedded DNS, so nginx resolves
    # the gateway per request instead of once at startup (a literal host that is not resolvable
    # yet when nginx starts makes it exit — seen live 2026-09-02).
    resolver 127.0.0.11 valid=10s;

    location ~ ^/(api|admin|auth|me|platform|tenant-users|preferences|dashboards|metadata|oauth|scim|public|health|\.well-known)(/|$) {
        set $upstream_api "http://management-service:3000";
        # nginx is the outermost hop here, so the address it sees IS the caller: overwrite what the
        # client sent instead of appending to it. Behind a load balancer, use the real_ip module.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass $upstream_api;
    }

    # React Router client-side routes — anything not matched above falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
