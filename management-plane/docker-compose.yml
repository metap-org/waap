# The WAF Customer Portal backend + web (production-mode images). Uses the shared dev
# Postgres/RabbitMQ that ../../metap/docker-compose.yml runs (`docker compose up -d postgres
# rabbitmq` there, host ports 5433/5672), reached through host.docker.internal.
#
# Before the first `docker compose up --build` (from this directory):
#   1. keys:   (cd ../../metap && go run ./cmd/dev-tools gen-jwks-key ../waap/management-plane/keys/jwks)
#              — zones-service is the only token issuer; everyone else verifies via its JWKS.
#   2. tenant + users + .env: see README.md "Chạy local" — the gateway logs into every upstream
#      with WAF_SERVICE_EMAIL/WAF_SERVICE_PASSWORD from .env (see .env.example).
#
# Every build uses `context: ../../` (the metap-org root): ./Dockerfile needs ../../metap for
# go.mod's replace, web/Dockerfile needs design-system/platform-ui/metap-themes.
x-service: &service
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./keys:/app/keys:ro

x-service-env: &service-env
  DATABASE_URL: postgres://metap:metap@host.docker.internal:5433/metap
  RABBITMQ_URL: amqp://metap:metap@host.docker.internal:5672
  CORS_ORIGINS: http://localhost:5173,http://localhost:8081
  GRPC_ENABLED: "true"

services:
  zones-service:
    <<: *service
    build: { context: ../../, dockerfile: waap/management-plane/Dockerfile, args: { SERVICE: zones-service } }
    ports: ["3000:3000", "3001:3001"]
    environment:
      <<: *service-env
      PORT: "3000"
      # The token issuer: signs every token and publishes /.well-known/jwks.json.
      JWKS_KEYS_DIR: /app/keys/jwks
      # gRPC targets for the cross-service zone-delete check (GuardedZonesBackend).
      SCANNING_GRPC_ADDR: scanning-service:3011
      ALERTING_GRPC_ADDR: alerting-service:3021
      # Dev/staging: DNS checks go to dns-mock. A real deployment leaves this unset (dns.google)
      # or points it at its own resolver.
      DOH_RESOLVER_URL: http://dns-mock:8053/resolve
    healthcheck: &health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      dns-mock: { condition: service_started }

  # Stand-in for the outside world's DNS (../devtools/dns-mock) — dev/staging only. Real DNS on
  # host :15353 (udp+tcp, container :5353; host 5353 is usually taken by mDNS), DoH + admin API + UI on :8053. Set DNS_MOCK_ADMIN_TOKEN on a shared staging
  # host so only the team can change records.
  dns-mock:
    build: { context: ../devtools/dns-mock }
    ports: ["${DNS_MOCK_HOST_PORT:-15353}:5353/udp", "${DNS_MOCK_HOST_PORT:-15353}:5353/tcp", "8053:8053"]
    environment:
      DNS_MOCK_STATE_FILE: /var/lib/dns-mock/state.json
      DNS_MOCK_SEED_FILE: /etc/dns-mock/seed.dev.json
      DNS_MOCK_ADMIN_TOKEN: ${DNS_MOCK_ADMIN_TOKEN:-}
      DNS_MOCK_UPSTREAM: ${DNS_MOCK_UPSTREAM:-}
    volumes:
      - dns-mock:/var/lib/dns-mock

  scanning-service:
    <<: *service
    build: { context: ../../, dockerfile: waap/management-plane/Dockerfile, args: { SERVICE: scanning-service } }
    ports: ["3010:3010", "3011:3011"]
    environment:
      <<: *service-env
      PORT: "3010"
      JWKS_URL: http://zones-service:3000/.well-known/jwks.json
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/health"]

  alerting-service:
    <<: *service
    build: { context: ../../, dockerfile: waap/management-plane/Dockerfile, args: { SERVICE: alerting-service } }
    ports: ["3020:3020", "3021:3021"]
    environment:
      <<: *service-env
      PORT: "3020"
      JWKS_URL: http://zones-service:3000/.well-known/jwks.json
      ANALYTICS_URL: http://analytics-api:3030
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3020/health"]

  graphql-gateway:
    <<: *service
    build: { context: ../../, dockerfile: waap/management-plane/Dockerfile, args: { SERVICE: waf-graphql-gateway } }
    ports: ["4000:4000"]
    environment:
      PORT: "4000"
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
      ANALYTICS_URL: http://analytics-api:3030
      JWKS_URL: http://zones-service:3000/.well-known/jwks.json
      # Every service account logs in at the issuer; REST_URL says where each upstream really is.
      UPSTREAM_1_NAME: zones
      UPSTREAM_1_GRPC_ADDR: zones-service:3001
      UPSTREAM_1_LOGIN_URL: http://zones-service:3000/auth/login
      UPSTREAM_1_REST_URL: http://zones-service:3000
      UPSTREAM_1_SERVICE_EMAIL: ${WAF_SERVICE_EMAIL:?set WAF_SERVICE_EMAIL in .env}
      UPSTREAM_1_SERVICE_PASSWORD: ${WAF_SERVICE_PASSWORD:?set WAF_SERVICE_PASSWORD in .env}
      UPSTREAM_2_NAME: scanning
      UPSTREAM_2_GRPC_ADDR: scanning-service:3011
      UPSTREAM_2_LOGIN_URL: http://zones-service:3000/auth/login
      UPSTREAM_2_REST_URL: http://scanning-service:3010
      UPSTREAM_2_SERVICE_EMAIL: ${WAF_SERVICE_EMAIL}
      UPSTREAM_2_SERVICE_PASSWORD: ${WAF_SERVICE_PASSWORD}
      UPSTREAM_3_NAME: alerting
      UPSTREAM_3_GRPC_ADDR: alerting-service:3021
      UPSTREAM_3_LOGIN_URL: http://zones-service:3000/auth/login
      UPSTREAM_3_REST_URL: http://alerting-service:3020
      UPSTREAM_3_SERVICE_EMAIL: ${WAF_SERVICE_EMAIL}
      UPSTREAM_3_SERVICE_PASSWORD: ${WAF_SERVICE_PASSWORD}
    depends_on:
      zones-service: { condition: service_healthy }
      scanning-service: { condition: service_healthy }
      alerting-service: { condition: service_healthy }

  # --- Analytics plane (../../analytics-plane) — separate plane, bundled here for local runs ---
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  analytics-api:
    build: { context: ../../, dockerfile: waap/analytics-plane/Dockerfile }
    ports: ["3030:3030"]
    environment:
      PORT: "3030"
      CLICKHOUSE_URL: clickhouse://default:@clickhouse:9000
      JWKS_URL: http://zones-service:3000/.well-known/jwks.json
      ANALYTICS_INGEST_TOKEN: ${ANALYTICS_INGEST_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3030/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      clickhouse: { condition: service_healthy }
      zones-service: { condition: service_healthy }

  # Production-mode web (pnpm build + nginx). For the Vite dev server use docker-compose.dev.yml.
  web:
    build: { context: ../../, dockerfile: waap/management-plane/web/Dockerfile }
    ports: ["8081:80"]
    depends_on:
      zones-service: { condition: service_healthy }
      scanning-service: { condition: service_healthy }
      alerting-service: { condition: service_healthy }
      graphql-gateway: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  dns-mock:
  clickhouse:
